# 從 Docker Hub 拉 image 跑的版本，貼進 Dockhand 用。
# 需要的變數：
#   TUNNEL_TOKEN         Cloudflare Zero Trust → Networks → Tunnels 拿到的權杖
#   ADMIN_PASSWORD_HASH  admin 密碼雜湊，在 NAS 上用 `openssl passwd -6 | base64 -w0` 產生
#
# 同一個網域、兩個入口（Tunnel 的 public hostname 設兩條，/admin 那條排前面）：
#   https://<網域>/admin*  → http://admin:7681   Access 只放 admin
#   https://<網域>/        → http://agent:7681   Access 放同仁
#
# 為什麼拆兩個容器：容器裡大家都是同一個 Linux 帳號 dev，同一個容器裡擋不住誰 cd 到哪。
# /repos（放所有 repo 的上層目錄）只掛在 admin 容器，一般同仁的 agent 容器裡根本沒有這個目錄。
# 兩個容器共用家目錄（Agent 登入一次兩邊都能用）與 tmux socket 目錄（admin 附接得到同仁的 session）。
#
# 網路：agent、admin 只接 internal（沒有對外路由，也連不到 LAN／NAS），對外一律經 egress proxy；
# egress 用黑名單擋掉私網段。不需要動 TrueNAS 主機的防火牆。

services:
  agent:
    image: overmindyuan/cdy_agent:latest
    # 每次部署都重拉，latest 才會換新。回滾就把 latest 改成 sha-xxxxxxx 那種 tag。
    pull_policy: always
    hostname: NAS-AGENT
    init: true
    environment:
      AGENT_ROLE: user
      # 可登入的工號，逗號分隔。改完重新部署即可（workspace/<工號> 會自動建立）。
      AGENT_USERS: "USER1,USER2,USER3"
      TZ: Asia/Taipei
      # ttyd 的第二道帳密（user:password）。留空就不啟用，控管交給 Cloudflare Access。
      TTYD_CREDENTIAL: ""
    volumes:
      # 同仁的程式碼：/workspace/<工號>
      - /path/to/workspace:/workspace
      # Agent 登入憑證、plugin、個人設定、uv/cargo/go 的快取（與 admin 共用）
      - /path/to/home:/home/dev
      # tmux socket（與 admin 共用）
      - /path/to/tmux:/tmp/tmux-3000
    expose:
      - "7681"
    networks:
      - internal
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: "6"
    mem_limit: 16g
    pids_limit: 2048
    depends_on:
      egress:
        condition: service_started
    restart: unless-stopped

  admin:
    image: overmindyuan/cdy_agent:latest
    pull_policy: always
    hostname: NAS-AGENT-ADMIN
    init: true
    environment:
      AGENT_ROLE: admin
      # admin 工號，逗號分隔。輸入後要密碼，進去看得到所有工號的 session，預設目錄是 /repos。
      AGENT_ADMINS: "USER1"
      AGENT_ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      # 跑在同一個網域的 /admin 底下。
      TTYD_BASE_PATH: /admin
      TZ: Asia/Taipei
      TTYD_CREDENTIAL: ""
    volumes:
      # 放所有 repo 的上層目錄，用 mr、tokei 管理各 repo。只有 admin 容器有。
      - /path/to/repos:/repos
      - /path/to/workspace:/workspace
      - /path/to/home:/home/dev
      - /path/to/tmux:/tmp/tmux-3000
    expose:
      - "7681"
    networks:
      - internal
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: "4"
    mem_limit: 8g
    pids_limit: 1024
    depends_on:
      egress:
        condition: service_started
    restart: unless-stopped

  egress:
    image: overmindyuan/cdy_agent_egress:latest
    pull_policy: always
    networks:
      - internal
      - outbound
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    networks:
      - internal
      - outbound
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      agent:
        condition: service_healthy
      admin:
        condition: service_healthy
    restart: unless-stopped

networks:
  # 沒有對外路由的內部網路：agent、admin、egress、cloudflared 在這裡互通。
  internal:
    internal: true
  # 一般 bridge，只有 egress 與 cloudflared 接，負責真正出網。
  outbound: {}
