# 全域 tmux 設定。放在 /etc 而不是家目錄：/home/dev 會被掛載蓋掉。
# 同仁要個人化可以自己寫 ~/.tmux.conf（tmux 會先讀這份，再讀家目錄那份）。
set -g mouse on
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g default-shell /bin/bash
set -g escape-time 10
set -g focus-events on

# 狀態列左側顯示工號（取自 socket 名稱 sock_<工號>）與 session 名稱。
set -g status-left-length 40
set -g status-left "#[bold] #{s/.*sock_//:socket_path} #[default]│ #S "
set -g status-right " Ctrl+B d 回選單 │ %H:%M "
